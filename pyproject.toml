[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phish-triage"
version = "0.1.0"
description = "CLI that triages suspicious .eml files: headers, links, attachments, threat intel, verdict."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "jinja2",
    "beautifulsoup4",
    "filetype",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phish_triage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear, UP pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
