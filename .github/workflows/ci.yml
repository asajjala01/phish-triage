name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Hook environments (ruff, gitleaks + its Go toolchain) are slow to build, so cache them.
      # The key changes whenever .pre-commit-config.yaml does, which forces a rebuild.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Same hooks, same pinned versions as the local git hook.
      - name: Lint and secret scan (pre-commit)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: pytest
