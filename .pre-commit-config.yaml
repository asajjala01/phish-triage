repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Runs on every commit: scans only what's staged.
      - id: gitleaks
      # Manual stage only (used by CI): scans every commit in the history.
      # --redact keeps any secret it finds out of the logs.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
